name: Update data and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *' # every 6 hours (UTC)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

      # Prices and stations are independent: a failure in one must not block the other or the deploy.
      # Failures are reported at the end (last step) so the run still turns red.
      - name: Update prices
        id: prices
        continue-on-error: true
        timeout-minutes: 3
        run: npm run update-data -- prices

      - name: Update stations
        id: stations
        continue-on-error: true
        timeout-minutes: 5
        run: npm run update-data -- stations

      - name: Commit updated data
        run: |
          git config user.name "ohmygas-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "chore(data): update prices [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Fail run if a data update failed
        if: steps.prices.outcome == 'failure' || steps.stations.outcome == 'failure'
        run: |
          echo "::error::Data update failed (prices: ${{ steps.prices.outcome }}, stations: ${{ steps.stations.outcome }}) - site deployed with previous data"
          exit 1
