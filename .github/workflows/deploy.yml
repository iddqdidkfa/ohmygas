name: Update data and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */3 * * *' # every 3 hours (UTC)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

      # Only prices are refreshed here. Stations are updated on a developer machine
      # (npm run update-data -- stations) and committed. A failed scrape must not block the
      # deploy, but should still turn the run red (see last step).
      - name: Update prices
        id: prices
        continue-on-error: true
        timeout-minutes: 3
        run: npm run update-data -- prices

      - name: Commit updated data
        run: |
          git config user.name "ohmygas-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "chore(data): update prices [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Fail run if the price update failed
        if: steps.prices.outcome == 'failure'
        run: |
          echo "::error::Price update failed - site deployed with previous prices"
          exit 1
