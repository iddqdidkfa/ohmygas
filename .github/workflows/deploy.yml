name: Update data and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */3 * * *' # every 3 hours (UTC)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Updates prices, commits them and builds the site. Slow/side-effecting work lives here,
  # so a flaky deploy can be re-run on its own ("Re-run failed jobs") without touching data.
  build:
    runs-on: ubuntu-latest
    outputs:
      # attempt-specific so "Re-run all jobs" never leaves two artifacts with the same name
      artifact: github-pages-${{ github.run_attempt }}
      prices: ${{ steps.prices.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Always build the newest commit of the branch, even when an old run is re-run
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

      # Only prices are refreshed here. Stations are updated on a developer machine
      # (see README) and committed. A failed scrape must not block the deploy,
      # but still turns the run red (see the last step of the deploy job).
      - name: Update prices
        id: prices
        continue-on-error: true
        timeout-minutes: 3
        run: npm run update-data -- prices

      - name: Commit updated data
        run: |
          git config user.name "ohmygas-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "chore(data): update prices [skip ci]"
            # Data files are generated: if another run pushed first, our fresher data wins any conflict.
            pushed=0
            for attempt in 1 2 3; do
              if git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
                pushed=1
                break
              fi
              echo "push attempt $attempt failed, retrying"
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
            [ "$pushed" = 1 ] || { echo "::error::could not push data commit"; exit 1; }
          fi

      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: apps/web/dist

  # Publishing only. Safe to re-run alone: it just deploys the artifact built above.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.artifact }}

      - name: Fail run if the price update failed
        if: needs.build.outputs.prices == 'failure'
        run: |
          echo "::error::Price update failed - site deployed with previous prices"
          exit 1
